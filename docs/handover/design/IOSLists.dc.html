<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pluck iOS · List</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#151A13}a:hover{color:#525A4E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6F8F4; color: #151A13; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-size: 15px; line-height: 20px; display: flex; flex-direction: column">
<div style="padding: 54px 8px 0; display: flex; align-items: center; justify-content: space-between">
<a href="IOSLists.dc.html" style="display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="#151A13" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Lists</a>
<button type="button" style="height: 36px; margin-right: 8px; padding: 0 12px; border-radius: 18px; border: 1px solid #CDD3C7; background: #FFFFFF; font: inherit; font-size: 14px; display: inline-flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 7.5V5a3.5 3.5 0 0 1 7 0v2.5M3.5 7.5h9v6h-9z" fill="none" stroke="#151A13" stroke-width="1.5" stroke-linejoin="round"></path></svg>Private · Share</button>
</div>
<div style="padding: 8px 16px 14px; display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.03em">Kitchen reno, to buy</h1>
<span style="color: #525A4E">Before the fitters come in December.</span>
<span style="font-size: 13px; color: #525A4E">{{tickedCount}} of 7 ticked</span>
</div>
<ol style="flex: 1; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border-top: 1px solid #DDE2D8; overflow: hidden">
<sc-for list="{{rows}}" as="it" hint-placeholder-count="7">
<li style="display: flex; align-items: flex-start; gap: 4px; padding: 6px 16px 10px 4px; border-bottom: 1px solid #DDE2D8">
<button type="button" aria-pressed="{{it.on}}" aria-label="Tick {{it.title}}" onClick="{{it.toggle}}" style="width: 44px; height: 44px; flex: none; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center">
<span style="width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; border: 1.5px solid {{it.ring}}; background: {{it.fill}}; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="{{it.tickColor}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
</button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding-top: 6px">
<b style="font-weight: 600; color: {{it.titleColor}}">{{it.title}}</b>
<span style="color: #525A4E; font-size: 14px; line-height: 19px">{{it.note}}</span>
</div>
</li>
</sc-for>
</ol>
<div style="position: absolute; right: 16px; bottom: 99px; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px; border-radius: 24px; background: #1E5C45; color: #F6F8F4; font-weight: 600"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="#7FD3AE" stroke-width="1.8" stroke-linecap="round"></path></svg>Add</div>
<nav aria-label="Tabs" style="height: 83px; box-sizing: border-box; padding: 6px 8px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #EDF0EA; border-top: 1px solid #DDE2D8">
<a href="IOSInbox.dc.html" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; color: #525A4E"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 9h3l1 2h4l1-2h3M3.5 3h9L14 9v4H2V9z" fill="none" stroke="#525A4E" stroke-width="1.4" stroke-linejoin="round"></path></svg>Inbox</a>
<a href="IOSInbox.dc.html" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; color: #525A4E"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12zM8 5v3l2 1.5" fill="none" stroke="#525A4E" stroke-width="1.4" stroke-linecap="round"></path></svg>Later</a>
<a href="IOSSearch.dc.html" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; color: #525A4E"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10zM10.6 10.6L14 14" fill="none" stroke="#525A4E" stroke-width="1.4" stroke-linecap="round"></path></svg>Search</a>
<a href="IOSLists.dc.html" aria-current="page" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01" fill="none" stroke="#151A13" stroke-width="1.7" stroke-linecap="round"></path></svg>Lists</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var R = [
  ["Induction hob, 60 cm, four zones", "Check the width against the worktop cut-out."],
  ["Tap with a pull-out spray", "Brushed steel, not chrome."],
  ["Under-cabinet LED strip, warm", "Two metres. Plug-in, no electrician."],
  ["Deep single sink, undermount", "The one from the showroom in Sandyford."],
  ["Soft-close hinges, 12", "Two spares."],
  ["Extractor, ducted", "Ask the fitters about the wall first."],
  ["Bar stools, two", "Counter height, 65 cm."]
];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { t: [true, true, false, true, false, false, false] }; }
  renderVals() {
    var t = this.state.t;
    return {
      tickedCount: t.filter(Boolean).length,
      rows: R.map((r, i) => ({ title: r[0], note: r[1], on: t[i] ? "true" : "false",
        ring: t[i] ? "#151A13" : "#9AA392", fill: t[i] ? "#7FD3AE" : "transparent", tickColor: t[i] ? "#151A13" : "transparent",
        titleColor: t[i] ? "#525A4E" : "#151A13",
        toggle: () => { var n = t.slice(); n[i] = !n[i]; this.setState({ t: n }); } }))
    };
  }
}
</script>
</body>
</html>
