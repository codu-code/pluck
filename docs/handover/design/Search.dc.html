<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pluck · Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#151A13}a:hover{color:#525A4E}
</style>
</helmet>
<div style="min-height: 960px; display: flex; flex-wrap: wrap; background: #F6F8F4; color: #151A13; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px">

<nav aria-label="Main" style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; background: #EDF0EA; display: flex; flex-direction: column; gap: 24px">
<a href="Main.dc.html" aria-label="Pluck" style="display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 24px; font-weight: 600; letter-spacing: -0.045em; text-decoration: none; color: #151A13"><dc-import name="Logo" size="24" tone="brand" hint-size="72px,24px"></dc-import></a>
<div style="display: flex; flex-direction: column; gap: 2px">
<a href="Main.dc.html" style="display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; text-decoration: none">Inbox<span style="color: #525A4E">24</span></a>
<a href="Later.dc.html" style="display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; text-decoration: none">Later<span style="color: #525A4E">41</span></a>
<a href="Collections.dc.html" style="display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; text-decoration: none">Lists<span style="color: #525A4E">6</span></a>
<a href="Archive.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; text-decoration: none">Archive</a>
<a href="Settings.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; text-decoration: none">Settings</a>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px 32px; border-bottom: 1px solid #DDE2D8">
<label style="flex: 1 1 320px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 8px; background: #FFFFFF; border: 1.5px solid #151A13">
<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10zM10.6 10.6L14 14" fill="none" stroke="#151A13" stroke-width="1.5" stroke-linecap="round"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span>
<input type="search" value="mcp auth" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; color: #151A13">
<kbd style="font: 12px 'Geist', sans-serif; color: #525A4E; border: 1px solid #D3D9CE; border-radius: 4px; padding: 0 6px">Esc</kbd>
</label>
</div>

<div style="width: 100%; max-width: 1040px; box-sizing: border-box; padding: 24px 32px 48px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #151A13; background: #1E5C45; color: #F6F8F4; font: inherit; font-size: 13px">Kind: any</button>
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #CDD3C7; background: transparent; font: inherit; font-size: 13px">Tag</button>
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #CDD3C7; background: transparent; font: inherit; font-size: 13px">List</button>
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #CDD3C7; background: transparent; font: inherit; font-size: 13px">Status</button>
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #CDD3C7; background: transparent; font: inherit; font-size: 13px">Date</button>
<span style="margin-left: auto; color: #525A4E; font-size: 13px">6 results · title, notes, tags, list names and body</span>
</div>

<div style="display: flex; flex-direction: column; border-top: 1px solid #DDE2D8">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="display: flex; gap: 16px; padding: 14px 12px; border-bottom: 1px solid #DDE2D8">
<svg width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="{{r.kindName}}" style="flex: none; margin-top: 2px"><path d="{{r.glyph}}" fill="none" stroke="#151A13" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline"><a href="Item.dc.html" style="font-weight: 600; text-decoration: none">{{r.title}}</a><span style="color: #525A4E; font-size: 13px">{{r.site}} · {{r.status}}</span></div>
<div style="color: #394034; font-size: 13px; line-height: 20px">{{r.pre}}<mark style="background: #C9EEDC; color: #151A13; padding: 0 2px; border-radius: 2px">{{r.hit}}</mark>{{r.post}}</div>
</div>
<span style="flex: none; color: #525A4E; font-size: 12px">{{r.when}}</span>
</div>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 12px; border-radius: 8px; background: #EDF0EA">
<span>Want it by meaning? Ask your AI.</span>
<button type="button" style="height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid #CDD3C7; background: #FFFFFF; font: inherit; font-size: 13px">Copy “What did I pluck about mcp auth?”</button>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
var G = {
  read: "M3 4.5h10M3 8h10M3 11.5h6",
  watch: "M3.5 3h9a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5v-7A1.5 1.5 0 0 1 3.5 3zM6.75 6v4l3.25-2z",
  image: "M3 3h10a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM2 11l3.5-3.5 3 3 2-2L14 12",
  note: "M3 13l.8-3L10.5 3.3l2.2 2.2L6 12.2zM9.3 4.5l2.2 2.2"
};
var N = { read: "Read", watch: "Watch", image: "Image", note: "Note" };
var R = [
  ["read", "How MCP auth actually works", "modelcontextprotocol.io", "Inbox", "…the server should never hold the user's password. ", "MCP auth", " is a token exchange, and the scope says who it acts for…", "2h"],
  ["watch", "Building an MCP server from scratch", "youtube.com", "Later", "Transcript, 31:04: “…and this is where ", "auth", " gets interesting, because the client has to refresh…”", "27 Sep"],
  ["image", "Whiteboard from the auth review", "Image", "Inbox", "Your note: “The refresh flow we threw away. Keep for the ", "MCP auth", " talk.”", "Sun"],
  ["note", "Talk: MCP auth in 20 minutes", "Note", "Inbox", "Three demos. One broken on purpose. End with the ", "auth", " checklist.", "18 Oct"],
  ["read", "OAuth scopes for people in a hurry", "blog post", "Archived", "Scopes are promises. Keep them narrow. In ", "MCP auth", " the narrowest scope wins.", "3 Sep"],
  ["note", "Highlight on “Tokens that leak”", "Note", "Later", "“Log the token id, never the token.” Your note: same rule for ", "MCP auth", " logs.", "1 Sep"]
];
class Component extends DCLogic {
  renderVals() {
    return { rows: R.map((r) => ({ glyph: G[r[0]], kindName: N[r[0]], title: r[1], site: r[2], status: r[3], pre: r[4], hit: r[5], post: r[6], when: r[7] })) };
  }
}
</script>
</body>
</html>
