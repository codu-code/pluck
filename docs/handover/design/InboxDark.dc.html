<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pluck · Inbox, dark, bulk select</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#ECEFE8}a:hover{color:#A0A898}
</style>
</helmet>
<div style="min-height: 960px; display: flex; flex-wrap: wrap; background: #10130F; color: #ECEFE8; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px">

<nav aria-label="Main" style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; background: #161A14; display: flex; flex-direction: column; gap: 24px">
<a href="Main.dc.html" aria-label="Pluck" style="display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 24px; font-weight: 600; letter-spacing: -0.045em; text-decoration: none; color: #ECEFE8"><dc-import name="Logo" size="24" tone="onDark" hint-size="72px,24px"></dc-import></a>
<div style="display: flex; flex-direction: column; gap: 2px">
<a href="Main.dc.html" aria-current="page" style="display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; background: #252A22; text-decoration: none; font-weight: 600">Inbox<span style="font-weight: 400; color: #A0A898">24</span></a>
<a href="Later.dc.html" style="display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; text-decoration: none">Later<span style="color: #A0A898">41</span></a>
<a href="Collections.dc.html" style="display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; text-decoration: none">Lists<span style="color: #A0A898">6</span></a>
<a href="Archive.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; text-decoration: none">Archive</a>
<a href="Settings.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; text-decoration: none">Settings</a>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px 32px; border-bottom: 1px solid #2A2F27">
<label style="flex: 999 1 320px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 8px; background: #191D17; border: 1px solid #363C33">
<span style="font-weight: 600">Pluck</span>
<input type="text" placeholder="Paste one link or many, or type a note" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; color: #ECEFE8">
</label>
<a href="Search.dc.html" style="flex: 1 1 200px; display: flex; align-items: center; justify-content: space-between; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; background: #191D17; text-decoration: none; color: #A0A898">Search<kbd style="font: 12px 'Geist', sans-serif; border: 1px solid #363C33; border-radius: 4px; padding: 0 6px">/</kbd></a>
</div>

<div style="width: 100%; max-width: 1040px; box-sizing: border-box; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h1 style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em">Inbox</h1>
<span style="color: #A0A898">24 to triage · newest first</span>
</div>

<div role="toolbar" aria-label="Bulk actions" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; height: 52px; box-sizing: border-box; padding: 0 8px 0 16px; border-radius: 8px; background: #ECEFE8; color: #10130F">
<b style="font-weight: 600; margin-right: auto">3 selected</b>
<button type="button" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 0; background: #D5DBCF; color: #10130F; font: inherit; font-size: 13px">Later</button>
<button type="button" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 0; background: #D5DBCF; color: #10130F; font: inherit; font-size: 13px">Archive</button>
<button type="button" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 0; background: #D5DBCF; color: #10130F; font: inherit; font-size: 13px">Tag</button>
<button type="button" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 0; background: #D5DBCF; color: #10130F; font: inherit; font-size: 13px">Add to list</button>
<button type="button" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; color: #10130F; font: inherit; font-size: 13px">Clear</button>
</div>

<div style="display: flex; flex-direction: column; border-top: 1px solid #2A2F27">
<sc-for list="{{rows}}" as="it" hint-placeholder-count="9">
<div style="display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 12px; border-bottom: 1px solid #2A2F27; background: {{it.bg}}">
<input type="checkbox" checked="{{it.sel}}" aria-label="Select {{it.title}}" style="width: 18px; height: 18px; margin: 0; accent-color: #7FD3AE">
<div style="width: 40px; height: 40px; flex: none; border-radius: 6px; background: {{it.tile}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">{{it.ini}}</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; gap: 8px; align-items: baseline; min-width: 0"><a href="Item.dc.html" style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none">{{it.title}}</a><span style="flex: none; color: #A0A898; font-size: 13px">{{it.site}} · {{it.meta}}</span></div>
<div style="color: #A0A898; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.ex}}</div>
</div>
<div style="display: flex; gap: 6px; flex: none">
<sc-for list="{{it.tags}}" as="t" hint-placeholder-count="2">
<sc-if value="{{t.mine}}" hint-placeholder-val="{{ true }}"><span style="display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 12px; background: #252A22; font-size: 12px">{{t.label}}</span></sc-if>
<sc-if value="{{t.claude}}" hint-placeholder-val="{{ false }}"><span title="Tagged by AI" style="display: inline-flex; align-items: center; gap: 6px; height: 24px; box-sizing: border-box; padding: 0 9px; border-radius: 12px; border: 1px solid #7A4C36; color: #D08A68; font-size: 12px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: #D08A68"></span>{{t.label}}</span></sc-if>
</sc-for>
</div>
<div style="width: 76px; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; color: #A0A898; font-size: 12px">
<svg width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="{{it.kindName}}"><path d="{{it.glyph}}" fill="none" stroke="#ECEFE8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span>{{it.when}}</span>
</div>
</div>
</sc-for>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
var G = {
  read: "M3 4.5h10M3 8h10M3 11.5h6",
  watch: "M3.5 3h9a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5v-7A1.5 1.5 0 0 1 3.5 3zM6.75 6v4l3.25-2z",
  pdf: "M4 2h5l3 3v9H4zM9 2v3h3M6 9h4M6 11.5h4",
  note: "M3 13l.8-3L10.5 3.3l2.2 2.2L6 12.2zM9.3 4.5l2.2 2.2",
  todo: "M3.5 2.5h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zM5.5 8.2l1.8 1.8 3.2-4",
  study: "M2 3.5c2-.8 4-.8 6 .5 2-1.3 4-1.3 6-.5v9c-2-.8-4-.8-6 .5-2-1.3-4-1.3-6-.5zM8 4v9"
};
var N = { read: "Read", watch: "Watch", pdf: "PDF", note: "Note", todo: "Todo" };
var R = [
  ["read", "How MCP auth actually works", "modelcontextprotocol.io", "12 min", "Tokens, scopes and the bit everyone gets wrong.", [["mcp"], ["auth"]], "2h", "MC", "#263020", 1],
  ["watch", "Postgres indexes in 40 minutes", "youtube.com", "41 min", "B-tree, GIN and BRIN, with a live demo.", [["postgres"], ["video", 1]], "5h", "YT", "#33302A", 1],
  ["note", "An MCP server for Assemble's estimates", "Note", "by you", "Let Claude read a takeoff and draft the lines.", [["assemble"]], "Yesterday", "", "#1E221C", 0],
  ["read", "Writing for engineers who skim", "email-in", "6 min", "Lead with the decision. Cut the warm-up.", [["writing"], ["codu"]], "Yesterday", "NL", "#26292B", 1],
  ["pdf", "Estimating for small builders.pdf", "PDF", "38 pages", "Rates, waste factors and groundworks.", [["assemble"]], "Tue", "PDF", "#292E25", 0],
  ["todo", "Learn window functions", "Todo", "due Fri", "ROW_NUMBER, LAG and running totals.", [["postgres"], ["study"]], "Tue", "", "#1E221C", 0],
  ["read", "Shipping side projects on weekends", "x.com", "thread", "Pick one boring stack. Ship on Sunday night.", [["codu", 1]], "Mon", "X", "#2A2A26", 0],
  ["todo", "Outline the Codú November talk", "Todo", "due 3 Nov", "Why MCP, a live build, what broke.", [["codu"]], "Mon", "", "#1E221C", 0],
  ["watch", "Drop D fingerstyle, slowly", "youtube.com", "14 min", "The pattern at 60 bpm first.", [["guitar"]], "Sun", "YT", "#33302A", 0]
];
class Component extends DCLogic {
  renderVals() {
    return { rows: R.map((r) => ({ glyph: G[r[0]], kindName: N[r[0]], title: r[1], site: r[2], meta: r[3], ex: r[4], tags: r[5].map((t) => ({ label: t[0], mine: !t[1], claude: !!t[1] })), when: r[6], ini: r[7], tile: r[8], sel: !!r[9], bg: r[9] ? "#20251E" : "transparent" })) };
  }
}
</script>
</body>
</html>
