<a href="Main.dc.html" aria-current="page" style="display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; background: #DFE4DA; text-decoration: none; font-weight: 600">Inbox<span style="font-weight: 400; color: #525A4E">24</span></a>

<a href="Archive.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; text-decoration: none">Archive</a>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px 32px; border-bottom: 1px solid #DDE2D8">
<label style="flex: 999 1 320px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 8px; background: #FFFFFF; border: 1px solid #D3D9CE">
<span style="font-weight: 600">Pluck</span>
<input type="text" placeholder="Paste one link or many, or type a note" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; color: #151A13">
<kbd style="font: 12px 'Geist', sans-serif; color: #525A4E; border: 1px solid #D3D9CE; border-radius: 4px; padding: 0 6px">c</kbd>
</label>
<a href="Search.dc.html" style="flex: 1 1 200px; display: flex; align-items: center; justify-content: space-between; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; background: #EBEEE7; text-decoration: none; color: #525A4E">Search<kbd style="font: 12px 'Geist', sans-serif; border: 1px solid #CDD3C7; border-radius: 4px; padding: 0 6px">/</kbd></a>

<div style="width: 100%; max-width: 1040px; box-sizing: border-box; padding: 28px 32px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h1 style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em">Inbox</h1>
<div role="radiogroup" aria-label="Sort" style="display: flex; padding: 2px; border-radius: 8px; background: #E3E8DE"><sc-for list="{{sorts}}" as="o" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: {{o.bg}}; font: inherit; font-size: 13px; font-weight: {{o.weight}}; cursor: pointer">{{o.label}}</button></sc-for></div>
</div>
<div role="group" aria-label="Kind" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 13px; cursor: pointer">{{c.label}}</button>
</sc-for>
<sc-if value="{{linksOpen}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; gap: 4px; align-items: center; padding-left: 6px; border-left: 1px solid #CDD3C7"><sc-for list="{{subchips}}" as="c" hint-placeholder-count="4"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 12px; cursor: pointer">{{c.label}}</button></sc-for></span></sc-if>
</div>

<div style="display: flex; flex-direction: column; border-top: 1px solid #DDE2D8">
<sc-for list="{{rows}}" as="it" hint-placeholder-count="10">
<div style="display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 12px; border-bottom: 1px solid #DDE2D8; background: {{it.bg}}">
<sc-if value="{{it.hasIni}}" hint-placeholder-val="{{ true }}"><div style="width: 40px; height: 40px; flex: none; border-radius: 6px; background: {{it.tile}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; letter-spacing: 0.02em">{{it.ini}}</div></sc-if>
<sc-if value="{{it.noIni}}" hint-placeholder-val="{{ false }}"><div style="width: 40px; height: 40px; flex: none; border-radius: 6px; border: 1px dashed #C3CABC; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="{{it.glyph}}" fill="none" stroke="#151A13" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></sc-if>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; gap: 8px; align-items: baseline; min-width: 0"><a href="Item.dc.html" style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none">{{it.title}}</a><span style="flex: none; color: #525A4E; font-size: 13px">{{it.site}} · {{it.meta}}</span></div>
<div style="color: #525A4E; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.ex}}</div>
</div>
<sc-if value="{{it.sel}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 4px; flex: none">
<button type="button" style="height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid #CDD3C7; background: #FFFFFF; font: inherit; font-size: 13px">Later <kbd style="font: 11px 'Geist', sans-serif; color: #525A4E">l</kbd></button>
<button type="button" style="height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid #CDD3C7; background: #FFFFFF; font: inherit; font-size: 13px">Archive <kbd style="font: 11px 'Geist', sans-serif; color: #525A4E">e</kbd></button>
<button type="button" style="height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid #CDD3C7; background: #FFFFFF; font: inherit; font-size: 13px">Tag <kbd style="font: 11px 'Geist', sans-serif; color: #525A4E">t</kbd></button>
<button type="button" style="height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid #CDD3C7; background: #FFFFFF; font: inherit; font-size: 13px">List <kbd style="font: 11px 'Geist', sans-serif; color: #525A4E">a</kbd></button>
<a href="Item.dc.html" style="display: flex; align-items: center; height: 32px; box-sizing: border-box; padding: 0 10px; border-radius: 6px; border: 1px solid #CDD3C7; background: #FFFFFF; font-size: 13px; text-decoration: none">Open <kbd style="font: 11px 'Geist', sans-serif; color: #525A4E; margin-left: 4px">o</kbd></a>
</div>
</sc-if>
<sc-if value="{{it.unsel}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 6px; flex: none">
<sc-for list="{{it.tags}}" as="t" hint-placeholder-count="2">
<sc-if value="{{t.mine}}" hint-placeholder-val="{{ true }}"><span style="display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 12px; background: #E3E8DE; font-size: 12px">{{t.label}}</span></sc-if>
<sc-if value="{{t.claude}}" hint-placeholder-val="{{ false }}"><span title="Tagged by AI" style="display: inline-flex; align-items: center; gap: 6px; height: 24px; box-sizing: border-box; padding: 0 9px; border-radius: 12px; border: 1px solid #C9A28E; color: #9A5536; font-size: 12px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: #B06A48"></span>{{t.label}}</span></sc-if>
</sc-for>
</div>
</sc-if>
<div style="width: 76px; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; color: #525A4E; font-size: 12px">
<svg width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="{{it.kindName}}"><path d="{{it.glyph}}" fill="none" stroke="#151A13" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span>{{it.when}}</span>
</div>
</div>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px; padding: 12px 0 32px; color: #525A4E; font-size: 12px">
<span><kbd>j</kbd> <kbd>k</kbd> move</span><span><kbd>l</kbd> later</span><span><kbd>e</kbd> archive</span><span><kbd>t</kbd> tag</span><span><kbd>a</kbd> add to list</span><span><kbd>x</kbd> select</span><span><kbd>?</kbd> all shortcuts</span>
</div>
</div>
</main>
</div>
