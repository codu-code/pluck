<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pluck icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span role="img" aria-label="Pluck" style="display: inline-flex; align-items: center; justify-content: center; flex: none; box-sizing: border-box; width: {{box}}; height: {{box}}; border-radius: {{radius}}; background: {{bg}}"><svg viewBox="0 0 20 20" aria-hidden="true" style="width: {{glyph}}; height: {{glyph}}; overflow: visible"><path d="{{stemD}}" fill="none" stroke="{{ink}}" stroke-width="{{stem}}" stroke-linecap="round"></path><circle cx="{{cx}}" cy="{{cy}}" r="3.5" fill="none" stroke="{{ink}}" stroke-width="{{ring}}"></circle><path d="{{sparks}}" fill="none" stroke="{{spark}}" stroke-width="{{sw}}" stroke-linecap="round"></path></svg></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":128,"min":12,"max":512,"unit":"px"},"tone":{"editor":"enum","options":["forest","mint","dark","bare","bareOnDark"],"default":"forest"},"$preview":{"width":128,"height":128}}'>
var TONES = {
  forest: { bg: "#1E5C45", ink: "#F6F8F4", spark: "#7FD3AE", tile: true },
  mint: { bg: "#7FD3AE", ink: "#1E5C45", spark: "#151A13", tile: true },
  dark: { bg: "#10130F", ink: "#ECEFE8", spark: "#7FD3AE", tile: true },
  bare: { bg: "transparent", ink: "#1E5C45", spark: "#34A07C", tile: false },
  bareOnDark: { bg: "transparent", ink: "#ECEFE8", spark: "#7FD3AE", tile: false }
};
class Component extends DCLogic {
  renderVals() {
    var size = parseInt(this.props.size, 10) || 128;
    var t = TONES[this.props.tone] || TONES.forest;
    var glyph = t.tile ? Math.round(size * (size <= 20 ? 0.84 : 0.66)) : size;
    var small = glyph <= 16;
    return {
      box: size + "px",
      radius: t.tile ? Math.round(size * 0.22) + "px" : "0",
      bg: t.bg, ink: t.ink, spark: t.spark,
      glyph: glyph + "px",
      // Optical centre: halfway between the p's own centre and the centre of the whole mark, sparks included.
      stemD: small ? "M4.6 7.3v10" : "M4.8 7.3v10",
      cx: small ? 8.6 : 8.8,
      cy: small ? 9.7 : 9.7,
      stem: small ? 4.5 : 4,
      ring: small ? 3.9 : 3.4,
      sparks: small ? "M14.3 3.9L15.6 2.5M15.7 7.3L17.5 7M11.4 1.9L11.6 0.6" : "M14.1 4.4L15.5 3M15.4 7.4L17.2 7.1M11.6 2.3L11.8 0.9",
      sw: small ? 2.3 : 2.2
    };
  }
}
</script>
</body>
</html>
