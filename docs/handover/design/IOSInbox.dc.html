<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pluck iOS · Inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#151A13}a:hover{color:#525A4E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6F8F4; color: #151A13; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-size: 15px; line-height: 20px; display: flex; flex-direction: column">
<div style="padding: 62px 16px 8px; display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 600; letter-spacing: -0.03em">Inbox</h1>
<a href="IOSSettings.dc.html" aria-label="Settings" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none"><span style="width: 32px; height: 32px; border-radius: 16px; background: #D6DCD0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">NM</span></a>
</div>
<div style="padding: 0 16px 10px; display: flex; align-items: center; gap: 8px">
<span style="color: #525A4E; font-size: 13px">24 to triage</span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; background: #F1E6D9; color: #7A4520; font-size: 12px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: #C27A3A"></span>2 to sync</span>
</div>

<div style="flex: 1; display: flex; flex-direction: column; border-top: 1px solid #DDE2D8; overflow: hidden">
<div style="position: relative; height: 72px; border-bottom: 1px solid #DDE2D8; background: #7FD3AE; overflow: hidden">
<span style="position: absolute; left: 20px; top: 26px; font-weight: 600">Later</span>
<div style="position: absolute; left: 104px; top: 0; width: 390px; height: 72px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; background: #F6F8F4">
<div style="width: 44px; height: 44px; flex: none; border-radius: 8px; background: #E1E6CF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">MC</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><b style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">How MCP auth actually works</b><span style="color: #525A4E; font-size: 13px">modelcontextprotocol.io · 12 min</span></div>
</div>
</div>
<sc-for list="{{rows}}" as="it" hint-placeholder-count="8">
<a href="IOSReader.dc.html" style="height: 72px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #DDE2D8; text-decoration: none">
<div style="width: 44px; height: 44px; flex: none; border-radius: 8px; background: {{it.tile}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">{{it.ini}}</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><b style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</b><span style="color: #525A4E; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.meta}}</span></div>
<div style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; color: #525A4E; font-size: 12px"><svg width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="{{it.kindName}}"><path d="{{it.glyph}}" fill="none" stroke="#151A13" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{it.when}}</div>
</a>
</sc-for>
</div>

<nav aria-label="Tabs" style="height: 83px; box-sizing: border-box; padding: 6px 8px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #EDF0EA; border-top: 1px solid #DDE2D8">
<a href="IOSInbox.dc.html" aria-current="page" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 9h3l1 2h4l1-2h3M3.5 3h9L14 9v4H2V9z" fill="none" stroke="#151A13" stroke-width="1.4" stroke-linejoin="round"></path></svg>Inbox</a>
<a href="IOSInbox.dc.html" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; color: #525A4E"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12zM8 5v3l2 1.5" fill="none" stroke="#525A4E" stroke-width="1.4" stroke-linecap="round"></path></svg>Later</a>
<a href="IOSSearch.dc.html" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; color: #525A4E"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10zM10.6 10.6L14 14" fill="none" stroke="#525A4E" stroke-width="1.4" stroke-linecap="round"></path></svg>Search</a>
<a href="IOSLists.dc.html" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; color: #525A4E"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h8M3 5h10M2.5 7.5h11v6h-11z" fill="none" stroke="#525A4E" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"></path></svg>Lists</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var G = {
  read: "M3 4.5h10M3 8h10M3 11.5h6",
  watch: "M3.5 3h9a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5v-7A1.5 1.5 0 0 1 3.5 3zM6.75 6v4l3.25-2z",
  pdf: "M4 2h5l3 3v9H4zM9 2v3h3M6 9h4M6 11.5h4",
  note: "M3 13l.8-3L10.5 3.3l2.2 2.2L6 12.2zM9.3 4.5l2.2 2.2",
  todo: "M3.5 2.5h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zM5.5 8.2l1.8 1.8 3.2-4",
  study: "M2 3.5c2-.8 4-.8 6 .5 2-1.3 4-1.3 6-.5v9c-2-.8-4-.8-6 .5-2-1.3-4-1.3-6-.5zM8 4v9"
};
var N = { read: "Read", watch: "Watch", pdf: "PDF", note: "Note", todo: "Todo" };
var R = [
  ["watch", "Postgres indexes in 40 minutes", "youtube.com · 41 min", "5h", "YT", "#E6DCD6"],
  ["note", "An MCP server for Assemble's estimates", "Note · by you", "1d", "", "#EDF0EA"],
  ["read", "Writing for engineers who skim", "email-in · 6 min", "1d", "NL", "#DCE1E3"],
  ["pdf", "Estimating for small builders.pdf", "PDF · 38 pages", "Tue", "PDF", "#E2E6DA"],
  ["todo", "Learn window functions", "Todo · due Fri", "Tue", "", "#EDF0EA"],
  ["read", "Shipping side projects on weekends", "x.com · thread", "Mon", "X", "#DFE2DC"],
  ["todo", "Outline the Codú November talk", "Todo · due 3 Nov", "Mon", "", "#EDF0EA"],
  ["watch", "Drop D fingerstyle, slowly", "youtube.com · 14 min", "Sun", "YT", "#E6DCD6"]
];
class Component extends DCLogic {
  renderVals() {
    return { rows: R.map((r) => ({ glyph: G[r[0]], kindName: N[r[0]], title: r[1], meta: r[2], when: r[3], ini: r[4], tile: r[5] })) };
  }
}
</script>
</body>
</html>
