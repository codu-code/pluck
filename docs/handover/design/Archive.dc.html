<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pluck · Archive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#151A13}a:hover{color:#525A4E}
</style>
</helmet>
<div style="min-height: 960px; display: flex; flex-wrap: wrap; background: #F6F8F4; color: #151A13; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px">

<nav aria-label="Main" style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; background: #EDF0EA; display: flex; flex-direction: column; gap: 24px">
<a href="Main.dc.html" aria-label="Pluck" style="display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 24px; font-weight: 600; letter-spacing: -0.045em; text-decoration: none; color: #151A13"><dc-import name="Logo" size="24" tone="brand" hint-size="72px,24px"></dc-import></a>
<div style="display: flex; flex-direction: column; gap: 2px">
<a href="Main.dc.html" style="display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; text-decoration: none">Inbox<span style="color: #525A4E">24</span></a>
<a href="Later.dc.html" style="display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; text-decoration: none">Later<span style="color: #525A4E">41</span></a>
<a href="Collections.dc.html" style="display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; text-decoration: none">Lists<span style="color: #525A4E">6</span></a>
<a href="Archive.dc.html" aria-current="page" style="display: flex; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; background: #DFE4DA; text-decoration: none; font-weight: 600">Archive</a>
<a href="Settings.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; text-decoration: none">Settings</a>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px 32px; border-bottom: 1px solid #DDE2D8">
<label style="flex: 999 1 320px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 8px; background: #FFFFFF; border: 1px solid #D3D9CE">
<span style="font-weight: 600">Pluck</span>
<input type="text" placeholder="Paste one link or many, or type a note" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; color: #151A13">
</label>
<a href="Search.dc.html" style="flex: 1 1 200px; display: flex; align-items: center; justify-content: space-between; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; background: #EBEEE7; text-decoration: none; color: #525A4E">Search<kbd style="font: 12px 'Geist', sans-serif; border: 1px solid #CDD3C7; border-radius: 4px; padding: 0 6px">/</kbd></a>
</div>

<div style="width: 100%; max-width: 1040px; box-sizing: border-box; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h1 style="margin: 0; font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em">Archive</h1>
<span style="color: #525A4E">Everything you archived, finished, or let expire. Nothing is ever deleted, and search still finds it.</span>
</div>
<div role="group" aria-label="Filter" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 13px; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; border-top: 1px solid #DDE2D8">
<sc-for list="{{rows}}" as="it" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 12px; border-bottom: 1px solid #DDE2D8">
<svg width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="{{it.kindName}}" style="flex: none"><path d="{{it.glyph}}" fill="none" stroke="#151A13" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<a href="Item.dc.html" style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none">{{it.title}}</a>
<span style="color: #525A4E; font-size: 13px">{{it.site}} · {{it.why}}</span>
</div>
<span style="flex: none; width: 88px; text-align: right; color: #525A4E; font-size: 12px">{{it.when}}</span>
<button type="button" style="flex: none; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid #CDD3C7; background: #FFFFFF; font: inherit; font-size: 13px">Restore</button>
</div>
</sc-for>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
var G = {
  read: "M3 4.5h10M3 8h10M3 11.5h6",
  watch: "M3.5 3h9a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5v-7A1.5 1.5 0 0 1 3.5 3zM6.75 6v4l3.25-2z",
  todo: "M3.5 2.5h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zM5.5 8.2l1.8 1.8 3.2-4",
  pdf: "M4 2h5l3 3v9H4zM9 2v3h3M6 9h4M6 11.5h4"
};
var N = { read: "Read", watch: "Watch", todo: "Todo", pdf: "PDF" };
var R = [
  ["read", "OAuth scopes for people in a hurry", "blog post", "archived by you", "you", "3 Sep"],
  ["todo", "Book the room for the October meetup", "Todo", "done", "you", "30 Sep"],
  ["watch", "Kubernetes in 100 seconds, again", "youtube.com", "expired after 30 days, kept here", "expired", "21 Oct"],
  ["read", "The state of JavaScript frameworks", "newsletter", "expired after 30 days, kept here", "expired", "19 Oct"],
  ["pdf", "Old pricing deck.pdf", "PDF", "archived by you", "you", "12 Oct"],
  ["read", "A guide to sourdough starters", "Pocket import", "imported", "import", "8 Oct"],
  ["read", "Twelve rules for code review", "Pocket import", "imported", "import", "8 Oct"],
  ["watch", "Barre chords without pain", "youtube.com", "archived by you", "you", "2 Oct"]
];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: "all" }; }
  renderVals() {
    var f = this.state.f;
    var opts = [["all", "All"], ["you", "By you"], ["expired", "Expired"], ["import", "Imported"]];
    return {
      chips: opts.map((o) => { var on = f === o[0]; return { label: o[1], on: on ? "true" : "false", bg: on ? "#151A13" : "transparent", fg: on ? "#F6F8F4" : "#151A13", border: on ? "#151A13" : "#CDD3C7", pick: () => this.setState({ f: o[0] }) }; }),
      rows: R.filter((r) => f === "all" || r[4] === f).map((r) => ({ glyph: G[r[0]], kindName: N[r[0]], title: r[1], site: r[2], why: r[3], when: r[5] }))
    };
  }
}
</script>
</body>
</html>
