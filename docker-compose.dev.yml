# Local services for dev and e2e. Ports are offset so they never clash with other projects.
name: pluck-dev
services:
  mongo:
    image: mongo:8.2
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports: ["27027:27017"]
    volumes: [mongo:/data/db]
    healthcheck:
      # Initiates the single-node replica set on first boot, then reports healthy once it is primary.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }"]
      interval: 2s
      timeout: 10s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1035:1025", "8035:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      retries: 30
volumes:
  mongo:
