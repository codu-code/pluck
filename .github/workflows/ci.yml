# The gate from CONTRIBUTING.md, on every pull request and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test # starts MongoDB, Mailpit, MinIO and the fixture pages itself (pnpm stack)

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm design
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The README promises `docker compose up`; this builds the same Dockerfile, and never pushes it.
  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # shortcut: the Dockerfile copies the whole repo before it installs, so the cache only saves a change that is not in the image (docs, e2e, iPhone, extension); copy the lockfile first when this job gets slow.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: . # the checkout, as docker compose builds it (.dockerignore applies)
          push: false
          load: true # into the runner's Docker, for the check below
          tags: pluck:ci
          cache-from: type=gha
          # Only main writes the cache. A pull request reads main's; its own would only fill the repo's 10 GB.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
      - name: pnpm is in the image (a container starts with no network)
        run: |
          want=$(node -p "require('./package.json').packageManager.split('@')[1]")
          got=$(docker run --rm --network none --entrypoint sh pluck:ci -c 'pnpm --version')
          echo "pnpm in the image: $got; package.json pins $want"
          test "$got" = "$want"
